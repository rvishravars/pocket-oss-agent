[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocket-oss-agent"
version = "0.1.0"
description = "Personalized one-page open-source contribution roadmaps"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# sentence-transformers pulls in torch, far too heavy to install on four Python
# versions in CI. The suite runs against DeterministicEmbeddings instead.
embeddings = ["sentence-transformers>=3.0"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "reportlab>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pocket_oss_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests are opt-in everywhere, including locally. CI must never spend
# money, and a developer should choose to, not discover it afterwards.
addopts = "-m 'not live'"
markers = [
    "live: calls a paid cloud API. Deselected by default; run with `pytest -m live`.",
]

[tool.coverage.run]
source = ["src/pocket_oss_agent"]
branch = true

[tool.coverage.report]
# The suite covers every statement today. Holding the line here means a new
# untested branch fails CI rather than quietly eroding the guarantee.
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    # Protocol method bodies are `...` by definition; there is nothing to run.
    # Written inline (`def x() -> str: ...`), so match the trailing ellipsis.
    "\\.\\.\\.$",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
