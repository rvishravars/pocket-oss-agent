name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format
        run: ruff format --check --diff .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared by requires-python; 3.14 is the ceiling
        # currently developed against. Both ends are verified locally.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: pytest
        env:
          # The suite mocks GitHub with respx and must never reach the network.
          # Blanking the token means a test that slips past its mock fails as
          # unauthenticated rather than quietly passing against live data.
          # Scoped to this step so actions/checkout keeps its own token.
          GITHUB_TOKEN: ""
        run: pytest -q --cov --junit-xml=results-${{ matrix.python-version }}.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: results-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  docs:
    name: Doc rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No em dashes
        # CLAUDE.md forbids U+2014. Checked here because it is the kind of rule
        # that silently rots when only a human remembers it.
        run: |
          # --exclude-dir matters: a contributor with a local .venv would
          # otherwise fail on em dashes inside third-party packages.
          if grep -rn "$(printf '\xe2\x80\x94')" --include='*.md' --include='*.py' \
               --exclude-dir=.git --exclude-dir=.venv . ; then
            echo "::error::Found em dash (U+2014). Use a plain dash instead."
            exit 1
          fi
          echo "No em dashes found."

      - name: Specs carry an implementation status
        run: |
          missing=0
          for f in specs/agents/*.md; do
            [ "$(basename "$f")" = "README.md" ] && continue
            if ! grep -q '^status:' "$f"; then
              echo "::warning file=$f::spec has no status field"
              missing=$((missing + 1))
            fi
          done
          echo "$missing spec(s) still unimplemented."
